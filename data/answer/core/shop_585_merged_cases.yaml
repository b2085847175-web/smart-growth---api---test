  - name: 未发送欢迎语_补水面膜咨询
    conversation_record:
      - role: user
        content: 我想买一套补水面膜，主要是换季脸干、容易泛红，应该怎么选？
      - role: assistant
        content: 如果主要是换季干燥和容易泛红，可以优先选择成分简单、以补水和舒缓为主的面膜。首次使用建议先在耳后或下颌处试用，确认没有刺痛、红肿等不适后再敷全脸。
      - role: user
        content: 如果我每天晚上使用，敷完以后还需要再涂水乳吗？
      - role: assistant
        content: 敷完后可以轻轻按摩至剩余精华吸收，再按照日常护肤顺序涂水乳或面霜，帮助锁住水分。如果敷完感觉黏腻，可以减少后续产品用量，不建议敷着面膜直接睡觉。
      - role: user
        content: 这套面膜一盒有多少片？敏感肌可以直接使用吗？
      - role: assistant
        content: 一盒的具体片数请以商品详情页和收到的外包装标注为准。敏感肌首次使用建议先做局部测试，使用过程中如果出现明显刺痛、发红或瘙痒，应立即停止使用并及时清洁。
      - role: user
        content: 我想今天下单，发货时间和赠品情况可以一起说明一下吗？
      - role: assistant
        content: 发货时间和当前赠品以提交订单时页面显示的活动规则为准。下单前可以查看商品详情页和结算页的发货及赠品说明；如果页面显示有赠品，通常会随订单一起发出，具体以订单记录为准。
