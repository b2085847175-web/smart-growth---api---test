suite:
  name: scene_multiturn_learning_simulation_4_turns
  mode: sequential
  quality: false
  match_score: false
  final_reply_equals_chat: false
  turn_interval_seconds: 1
  assertions: false

target_env: dev

cases:
  # 异常场景：前三轮围绕首个商品提问，第 4 轮发送新商品链接，再围绕新商品连续提问三轮。
  - name: abnormal_product_switch_after_three_questions
    context_messages:
      - role: user
        content: https://app.kwaixiaodian.com/page/kwaishop-goods-detail-h5-vue/detail?id=25115313730864
    turns:
      - question: 这款洗发水适合油头吗
      - question: 洗完会不会很干
      - question: https://app.kwaixiaodian.com/page/kwaishop-goods-detail-h5-vue/detail?id=26527925157864
      - question: 油头可以每天使用这款洗发水吗
      - question: 效果怎么样

  - name: abnormal_product_switch_after_four_questions
    context_messages:
      - role: user
        content: https://app.kwaixiaodian.com/page/kwaishop-goods-detail-h5-vue/detail?id=251153137308641
    turns:
      - question: 这款产品适合什么肤质
      - question: 干皮使用会不会拔干
      - question: 敏感肌可以使用吗
      - question: 使用时有哪些注意事项
      - question: https://app.kwaixiaodian.com/page/kwaishop-goods-detail-h5-vue/detail?id=26527925157864
      - question: 这款产品主要有什么功效
      - question: 油皮使用会不会油腻
      - question: 应该多久使用一次

  # 异常场景：先围绕首个商品连续咨询四轮，再发送新商品链接，继续围绕新商品咨询四轮。
  - name: abnormal_product_switch_after_four_questions
    context_messages:
      - role: user
        content: https://app.kwaixiaodian.com/page/kwaishop-goods-detail-h5-vue/detail?id=25115313730864
    turns:
      - question: 这款产品适合什么肤质
      - question: 干皮使用会不会拔干
      - question: 敏感肌可以使用吗
      - question: 使用时有哪些注意事项
      - question: https://app.kwaixiaodian.com/page/kwaishop-goods-detail-h5-vue/detail?id=26527925157864
      - question: 这款产品主要有什么功效
      - question: 油皮使用会不会油腻
      - question: 应该多久使用一次
      - question: 看看成分表

  # 边界场景：仅三轮商品咨询，用于验证最小多轮会话长度。
  - name: boundary_three_turn_product_consultation
    context_messages:
      - role: user
        content: https://app.kwaixiaodian.com/page/kwaishop-goods-detail-h5-vue/detail?id=25115313730864
    turns:
      - question: 这款产品适合什么肤质
      - question: 应该多久使用一次
      - question: 使用时有哪些注意事项

  # 非商品知识场景：物流问题不应沉淀为商品知识。
  - name: non_product_logistics
    turns:
      - question: 我的订单什么时候可以发货
      - question: 物流单号在哪里查看
      - question: 已经发货后可以催一下物流吗
      - question: 正常情况下快递大概几天送到

  # 非商品知识场景：订单状态和支付问题不应沉淀为商品知识。
  - name: non_product_order
    turns:
      - question: 订单一直显示待付款是什么情况
      - question: 支付成功后订单状态没有更新怎么办
      - question: 已经关闭的订单还能恢复吗
      - question: 在哪里可以查看订单详情

  # 非商品知识场景：退货、退款和运费属于售后问题，不应沉淀为商品知识。
  - name: non_product_after_sales
    turns:
      - question: 收到后发现不合适可以退货吗
      - question: 退货运费需要谁承担
      - question: 商品拆封后还可以申请退款吗
      - question: 退款大概多久到账

  # 非商品知识场景：投诉处理和反馈渠道不应沉淀为商品知识。
  - name: non_product_complaint
    turns:
      - question: 你们客服一直没有处理我的问题
      - question: 我要投诉这次服务
      - question: 投诉渠道在哪里
      - question: 投诉后多久能给处理结果

  # 非商品知识场景：发票开具和抬头修改不应沉淀为商品知识。
  - name: non_product_invoice
    turns:
      - question: 购买后可以开电子发票吗
      - question: 发票抬头在哪里填写
      - question: 已经开出的发票可以修改吗
      - question: 电子发票一般什么时候开出来

  # 非商品知识场景：平台入口和操作路径不应沉淀为商品知识。
  - name: non_product_platform_operation
    turns:
      - question: 快手小店里面怎么申请退款
      - question: 我找不到修改收货地址的入口
      - question: 平台客服应该从哪里联系
      - question: 申请退款后在哪里查看处理进度

  # 非商品知识场景：仅寒暄和确认客服是否在线，不应生成商品知识。
  - name: non_product_greeting
    turns:
      - question: 你好在吗
      - question: 现在有客服在线吗
      - question: 看到消息回复一下
      - question: 现在方便咨询吗

  # 非商品知识场景：催促回复或催促处理，不应生成商品知识。
  - name: non_product_urge
    turns:
      - question: 麻烦快点处理
      - question: 可以马上回复我吗
      - question: 我已经等很久了
      - question: 今天可以帮我处理好吗

  # 非商品知识场景：确认、感谢和结束语不应生成商品知识。
  - name: non_product_end
    turns:
      - question: 好的我知道了
      - question: 谢谢你的回复
      - question: 没有其他问题了
      - question: 那我先不咨询了

  # 非商品知识场景：仅咨询优惠券和活动规则，不应沉淀为稳定商品知识。
  - name: non_product_promotion
    turns:
      - question: 店铺现在有满减活动吗
      - question: 优惠券在哪里领取
      - question: 买两件会更便宜吗
      - question: 这个优惠活动什么时候结束

  # 非商品知识场景：同一会话涉及两个商品对比，无法唯一关联焦点商品。
  - name: non_product_multi_product_comparison
    context_messages:
      - role: user
        content: https://app.kwaixiaodian.com/page/kwaishop-goods-detail-h5-vue/detail?id=25115313730864
      - role: user
        content: https://app.kwaixiaodian.com/page/kwaishop-goods-detail-h5-vue/detail?id=26527925157864
    turns:
      - question: 这两个商品有什么区别
      - question: 哪一款更适合敏感肌
      - question: 只能买一个的话建议选哪个
      - question: 这两款商品的使用方法有什么不同
