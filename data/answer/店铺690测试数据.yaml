suite:
  name: scene_multiturn_learning_simulation_4_turns
  mode: sequential
  quality: false
  match_score: false
  final_reply_equals_chat: false
  turn_interval_seconds: 1
  assertions: false

target_env: dev

cases:
  # 测试目标：测试油性头皮洗发水的适用性、使用感受和使用频率是否可形成商品知识。
  # 预期处理：应进入学习候选，属于适用人群、使用感受和使用方式类商品知识。
  - name: learning_candidate_shampoo_oily_scalp
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 这款洗发水适合油头吗
      - question: 洗完会不会很干
      - question: 建议多久洗一次

      - question: 油头可以每天使用这款洗发水吗
  # 测试目标：测试防晒指数、肤感和卸妆方式等明确商品信息是否可被学习。
  # 预期处理：应进入学习候选，属于产品属性、适用肤质和使用方式类知识。
  - name: learning_candidate_sunscreen_usage
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 这款防晒霜的防晒指数是多少
      - question: 油皮用起来会不会很黏
      - question: 晚上需要卸妆吗

      - question: 在户外大概多久需要补涂一次
  # 测试目标：测试敏感肌适用性、成分限制和泛红期使用方式是否可被学习。
  # 预期处理：应进入学习候选，属于适用人群、成分和注意事项类知识。
  - name: learning_candidate_sensitive_skin
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 这款面霜敏感肌能用吗
      - question: 里面有酒精和香精吗
      - question: 换季泛红的时候怎么使用

      - question: 第一次使用需要先做局部测试吗
  # 测试目标：测试明确咨询商品主要功效、改善问题和起效周期时的知识提取。
  # 预期处理：应进入学习候选，重点验证功效信息不得被夸大或绝对化。
  - name: learning_candidate_product_effect
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 这款产品主要有什么功效
      - question: 坚持使用可以改善什么问题
      - question: 一般使用多久能感受到效果

      - question: 停止使用以后效果会不会慢慢消失
  # 测试目标：测试商品主要成分、成分作用和刺激性成分是否可被提取。
  # 预期处理：应进入学习候选，属于成分和注意事项类知识。
  - name: learning_candidate_ingredients
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 这款产品主要有哪些成分
      - question: 核心成分分别有什么作用
      - question: 有没有需要注意的刺激性成分

      - question: 这些成分对敏感肌会不会有刺激
  # 测试目标：测试商品使用方法、护肤步骤和单次用量是否可被提取。
  # 预期处理：应进入学习候选，属于使用方式类知识。
  - name: learning_candidate_usage_steps
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 这款产品具体怎么使用
      - question: 应该用在护肤的哪一个步骤
      - question: 每次大概使用多少量

      - question: 使用以后需要再清洗吗
  # 测试目标：测试每日使用次数、早晚使用和连续使用要求是否可被提取。
  # 预期处理：应进入学习候选，属于使用频率和使用方式类知识。
  - name: learning_candidate_usage_frequency
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 这款产品一天使用几次合适
      - question: 早晚都可以使用吗
      - question: 需要每天连续使用吗

      - question: 出现轻微不适时需要降低使用频率吗
  # 测试目标：测试适用人群、性别和适用年龄等商品知识是否可被提取。
  # 预期处理：应进入学习候选，属于适用人群类知识。
  - name: learning_candidate_suitable_people
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 这款产品适合哪些人使用
      - question: 男生和女生都可以用吗
      - question: 多大年龄开始使用比较合适

      - question: 孕妇或者哺乳期可以使用吗
  # 测试目标：测试不同肤质的适用性及油腻、保湿感受是否可被提取。
  # 预期处理：应进入学习候选，属于适用肤质和使用感受类知识。
  - name: learning_candidate_skin_type
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 这款产品更适合什么肤质
      - question: 油性皮肤使用会不会油腻
      - question: 干性皮肤使用保湿够吗

      - question: 混合性皮肤应该怎么控制用量
  # 测试目标：测试使用注意事项、皮肤破损限制和首次测敏要求是否可被提取。
  # 预期处理：应进入学习候选，属于注意事项和使用限制类知识。
  - name: learning_candidate_precautions
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 使用这款产品有什么注意事项
      - question: 皮肤有破损的时候可以使用吗
      - question: 第一次使用需要先做测试吗

      - question: 使用后出现刺痛应该怎么处理
  # 测试目标：测试同一商品不同规格的区别、成分一致性和选购建议。
  # 预期处理：应进入学习候选，重点验证知识需保留规格信息，不得笼统合并。
  - name: learning_candidate_spec_difference
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 这款商品不同规格有什么区别
      - question: 小规格和大规格的成分一样吗
      - question: 第一次购买更建议选择哪个规格

      - question: 不同规格的使用方法是一样的吗
  # 测试目标：测试保存方式、开封后使用期限和是否需要冷藏等稳定商品信息。
  # 预期处理：应进入学习候选，属于储存方式和保质期类知识。
  - name: learning_candidate_storage_and_shelf_life
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 这款产品平时应该怎么保存
      - question: 开封以后可以使用多长时间
      - question: 需要放在冰箱里面保存吗

      - question: 天气炎热时常温保存会不会变质
  # 测试目标：测试有效会话超过三轮时，系统是否仍能完整识别并提取知识。
  # 预期处理：应进入学习候选，验证四轮会话不会因超过最低轮次而被过滤。
  - name: learning_candidate_four_turns
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 这款产品的主要作用是什么
      - question: 敏感肌可以使用吗
      - question: 应该早上用还是晚上用
      - question: 使用后还需要搭配其他产品吗

  # 测试目标：测试多轮问题始终围绕同一商品时的焦点商品识别。
  # 预期处理：应进入学习候选，并将全部有效知识关联到同一商品。
  - name: learning_candidate_same_focus_product
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 我想了解链接里的这款产品
      - question: 它适合油性皮肤吗
      - question: 油性皮肤应该怎么控制用量

      - question: 使用这款产品还需要注意什么
  # 测试目标：测试仅包含发货、催仓和修改地址等物流问题的会话。
  # 预期处理：应排除，不得生成商品知识。
  - name: learning_exclude_logistics
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 我昨天买的订单怎么还没发货
      - question: 可以帮我催一下仓库吗
      - question: 发货后能改收货地址吗

      - question: 正常情况下快递大概几天能送到
  # 测试目标：测试仅包含满减、优惠券和多件优惠等临时促销问题的会话。
  # 预期处理：应排除，临时优惠信息不得沉淀为稳定商品知识。
  - name: learning_exclude_promotion_only
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 现在有满减活动吗
      - question: 优惠券在哪里领取
      - question: 买两件会更便宜吗

      - question: 这个优惠活动什么时候结束
  # 测试目标：测试仅包含退货、运费和退款到账等售后问题的会话。
  # 预期处理：应排除，不得生成商品知识。
  - name: learning_exclude_after_sales
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 收到后发现不适合可以退吗
      - question: 退货运费谁承担
      - question: 退款大概多久到账

      - question: 商品拆封以后还可以申请退货吗
  # 测试目标：测试仅包含付款状态、待付款和订单恢复等订单问题的会话。
  # 预期处理：应排除，不得生成商品知识。
  - name: learning_exclude_order_status
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 帮我查一下这个订单有没有付款成功
      - question: 为什么订单状态还是待付款
      - question: 已经取消的订单还能恢复吗

      - question: 订单关闭后支付的钱多久退回
  # 测试目标：测试仅包含客服投诉和投诉渠道等投诉类问题的会话。
  # 预期处理：应排除，不得生成商品知识。
  - name: learning_exclude_complaint
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 你们客服一直不处理我的问题
      - question: 我要投诉负责这个订单的客服
      - question: 请告诉我投诉渠道在哪里

      - question: 投诉以后多久可以给出处理结果
  # 测试目标：测试仅包含开票、发票抬头和修改发票等发票问题的会话。
  # 预期处理：应排除，不得生成商品知识。
  - name: learning_exclude_invoice
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 购买后可以开电子发票吗
      - question: 发票抬头在哪里填写
      - question: 已经开出的发票可以修改吗

      - question: 电子发票一般什么时候开出来
  # 测试目标：测试仅包含淘宝退款入口、修改地址入口和平台客服入口等平台操作问题。
  # 预期处理：应排除，不得生成商品知识。
  - name: learning_exclude_platform_operation
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 淘宝里面怎么申请退款
      - question: 我找不到修改地址的入口
      - question: 平台客服应该从哪里联系

      - question: 申请退款后在哪里查看处理进度
  # 测试目标：测试仅包含问候和确认客服是否在线的无商品信息会话。
  # 预期处理：应排除，寒暄内容不得进入学习候选。
  - name: learning_exclude_greeting_only
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 你好在吗
      - question: 有客服在线吗
      - question: 看到消息回复一下

      - question: 现在方便回复消息吗
  # 测试目标：测试仅包含催促处理和催促回复的会话。
  # 预期处理：应排除，催促话术不得生成知识。
  - name: learning_exclude_urge_only
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 麻烦快点处理
      - question: 可以马上回复我吗
      - question: 我已经等很久了

      - question: 今天可以帮我处理好吗
  # 测试目标：测试仅包含确认、感谢和结束语的会话。
  # 预期处理：应排除，结束语不得生成知识。
  - name: learning_exclude_end_only
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 好的我知道了
      - question: 谢谢你的回复
      - question: 没有其他问题了

      - question: 那我先不咨询了
  # 测试目标：测试仅表达购买意愿、是否可下单和购买数量建议的会话。
  # 预期处理：应排除，纯购买意图且无稳定商品信息时不得生成知识。
  - name: learning_exclude_pure_purchase_intent
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 我准备买这款
      - question: 现在下单可以吗
      - question: 麻烦给我推荐一下购买数量

      - question: 第一次买一次买几件比较合适
  # 测试目标：测试同时关联两个商品并进行效果、肤质和选购对比的会话。
  # 预期处理：应排除，无法识别唯一焦点商品且属于多商品对比。
  - name: learning_exclude_multi_product_comparison
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 这两个商品哪个效果更好
      - question: 哪一个更适合敏感皮肤
      - question: 只能买一个的话应该选哪个

      - question: 这两款的使用方法有什么区别
  # 测试目标：测试会话第一轮即提出转人工时是否整段过滤。
  # 预期处理：应排除，存在转人工意图的会话不得学习。
  - name: learning_exclude_transfer_at_start
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 帮我转人工客服
      - question: 我想咨询一下这款产品
      - question: 人工客服什么时候能接待

      - question: 请尽快帮我接入人工客服
  # 测试目标：测试会话中途提出转人工时是否整段过滤。
  # 预期处理：应排除，即使前面包含商品问题也不得继续学习。
  - name: learning_exclude_transfer_in_middle
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 这款产品敏感肌可以使用吗
      - question: 这个回答不清楚帮我转人工
      - question: 请让人工客服继续回答

      - question: 人工客服现在在线吗
  # 测试目标：测试会话最后一轮提出转人工时是否整段过滤。
  # 预期处理：应排除，验证转人工发生在末尾仍能被识别。
  - name: learning_exclude_transfer_at_end
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 这款产品主要有哪些成分
      - question: 这些成分分别有什么作用
      - question: 我还是想找人工客服确认一下

      - question: 麻烦现在直接帮我转人工
  # 测试目标：测试总共四轮会话中仅有两轮明确商品咨询时，系统按总轮次还是有效商品问答轮次判断。
  # 预期处理：边界场景；若要求至少三轮有效商品问答则应排除，需确认轮次计算规则。
  - name: learning_boundary_two_effective_product_turns
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 这款产品敏感肌可以使用吗
      - question: 一天使用几次比较合适

      - question: 你好在吗
      - question: 谢谢你的回复
  # 测试目标：测试总共四轮会话中仅有一轮明确商品咨询时，系统按总轮次还是有效商品问答轮次判断。
  # 预期处理：边界场景；若要求至少三轮有效商品问答则应排除，需确认轮次计算规则。
  - name: learning_boundary_one_effective_product_turn
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 这款产品有什么功效

      - question: 你好在吗
      - question: 可以回复一下吗
      - question: 没有其他问题了
  # 测试目标：测试“这个怎么样、可以用吗、效果好吗”等缺少明确指向的问题。
  # 预期处理：应排除，问题含义不明确时不得生成知识。
  - name: learning_exclude_unclear_questions
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 这个怎么样
      - question: 可以用吗
      - question: 效果好吗

      - question: 这款值得买吗
  # 测试目标：测试会话仅包含表情、图片占位和表情消息等不可读内容。
  # 预期处理：应排除，缺少可用于提取的有效文本。
  - name: learning_exclude_unreadable_content
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
    turns:
      - question: 😊😊😊
      - question: "[图片]"
      - question: "[表情消息]"

      - question: "[语音消息]"
  # 测试目标：测试仅包含系统通知和平台事件的会话。
  # 预期处理：应排除，系统事件不得作为买家有效问题参与学习。
  - name: learning_exclude_system_event_only
    context_messages:
      - role: user
        content: https://item.taobao.com/item.htm?id=3825017609737338890
