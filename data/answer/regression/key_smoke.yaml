# 由 scripts/build_key_regression_cases.py 生成，请勿手工编辑。
# 精简回归集，约 200 条。完整集见 `all` 入口（2916 条）。
#
# 选材原则：人工复核过的用例优先；官方质检点用得最多（断言二级质检点名称）；
# KB 场景分类按场景轮转，优先铺开场景覆盖而不是同一场景多问法。

# 用途：只跑接口、不查质检的冒烟用例
suite:
  name: key_smoke
  mode: sequential
  quality: false
  assertions: false
  match_score: false
  final_reply_equals_chat: false
  turn_interval_seconds: 1
target_env: dev

