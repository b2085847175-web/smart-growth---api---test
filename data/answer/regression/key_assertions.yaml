# 由 scripts/build_key_regression_cases.py 生成，请勿手工编辑。
# 精简回归集，约 200 条。完整集见 `all` 入口（2916 条）。
#
# 选材原则：人工复核过的用例优先；官方质检点用得最多（断言二级质检点名称）；
# KB 场景分类按场景轮转，优先铺开场景覆盖而不是同一场景多问法。

# 用途：有业务断言、需查质检的用例
suite:
  name: key_assertions
  mode: sequential
  quality: true
  assertions: true
  match_score: false
  final_reply_equals_chat: false
  turn_interval_seconds: 1
  quality_retries: 10
  quality_retry_interval_seconds: 2
target_env: dev

cases:
  - name: official_quality_points::未发送欢迎语
    turns:
    - question: 客户咨询“未发送欢迎语”，请问这种情况应该怎么处理？
    - question: 如果现在仍然遇到“未发送欢迎语”的问题，能再具体说明一下吗？
    - question: 关于“未发送欢迎语”，请给我一个明确的处理结果。
      expect:
        scene: 未发送欢迎语
    _source_case: 未发送欢迎语
    _source_file: data/answer/regression/official_quality_points_cases.yaml
