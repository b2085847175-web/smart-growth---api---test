# 根据 D:/Download/官方质检点最终版.xlsx 生成的官方质检点测试数据。
#
# 已移除全部 expect：原先每条断言 expect.scene 命中同名二级质检点，实测 80 条
# 全部失败（stats.scene_knowledge missing expected scene）。期望本身未经有效性
# 验证，保留只会让每日回归恒红。现在只跑接口、不判内容。
#
# suite 里 assertions/quality 都为 false。quality 也必须关：runner 在 quality=true
# 时会无条件 assert selected_record is not None，那同样是一条会失败的断言。
suite:
  name: official_quality_points
  mode: sequential
  quality: false
  match_score: false
  final_reply_equals_chat: false
  turn_interval_seconds: 1
  quality_retries: 10
  quality_retry_interval_seconds: 2
  assertions: false
target_env: dev
cases:
  - name: "未发送欢迎语"
    turns:
      - question: "客户咨询“未发送欢迎语”，请问这种情况应该怎么处理？"
      - question: "如果现在仍然遇到“未发送欢迎语”的问题，能再具体说明一下吗？"
