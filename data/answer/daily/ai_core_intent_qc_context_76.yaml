    context_messages:
      - role: user
        content: "[订单消息]"
        media_type: text
        media_url: ""
      - role: assistant
        content: "欢迎光临本店，很高兴与您相遇，我是您的专属护肤顾问，羽素将会在变美的道路上一直陪伴您~"
