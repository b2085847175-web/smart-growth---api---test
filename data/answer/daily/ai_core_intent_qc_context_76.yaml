# 来源：AI核心意图_用户可见描述优化版_76条.xlsx（76 条标签逐条生成 context-only 会话）。
# 说明：每个 context-only 用例保留到最后一条用户消息作为触发语。对话严格命中对应标签的"命中条件"，并避开"排除条件"中提到的其他标签。
# 场景沿用店铺现有护肤品类（羽素）。每个用例上方注释标注：一级分组/二级分组/核心意图。
suite:
  name: ai_core_intent_qc_context_76
  mode: sequential
  quality: true
  assertions: false
  match_score: false
  final_reply_equals_chat: false
  turn_interval_seconds: 1

target_env: dev

cases:
  # 物流咨询/发货时间/咨询何时发货
