        media_url: ""
      - role: assistant
        content: "宝宝，看您刚拍下了羽素修护精华液正装，这边马上为您安排哦~"
        media_type: text
        media_url: ""
      - role: user
        content: "你们家什么时候发货"
        media_type: text
        media_url: ""
      - role: assistant
        content: "亲亲，现货商品下单后48小时内为您发出哦~"
        media_type: text
        media_url: ""
      - role: user
        content: "能在周五之前发出来吗"
        media_type: text
        media_url: ""
      - role: assistant
        content: "宝宝放心，今天下午5点前拍下的订单当天就能安排发出，周五前肯定到不了的话也不会耽误您收货的呢~"
        media_type: text
        media_url: ""
      - role: user
        content: "那大概是几号能发"
        media_type: text
        media_url: ""

